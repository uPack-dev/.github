# Reusable: lint, build a Nuxt SSR app, rsync `.output/` into `<target>/.output`
# on adm.tools hosting, write a `package.json` start script into the target
# root, then reload the Node app. Call with `secrets: inherit`; the
# `production` environment is resolved in the calling repository.
#
# Required in the caller: secrets SERVER_SSH_KEY, SERVER_HOST, SERVER_USER,
# ADM_TOOLS_KEY; variable HOST_ID (or the `host-id` input).
name: Nuxt → adm.tools (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Remote app root that receives package.json and .output/, e.g. site.com/www
        required: true
        type: string
      working-directory:
        description: Directory with the Nuxt app
        type: string
        default: .
      build-env:
        description: >-
          Multiline KEY=VALUE list exported for `pnpm build` (use `vars` here —
          every inherited secret is exported under its own name automatically).
        type: string
        default: ''
      host-id:
        description: adm.tools Node app id; defaults to the HOST_ID variable
        type: string
        default: ''
      node-version:
        type: string
        default: '22.21.1'
      runner:
        type: string
        default: blacksmith-2vcpu-ubuntu-2404

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  deploy:
    needs: lint
    runs-on: ${{ inputs.runner }}
    environment: production
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Cache Nuxt Fonts
        uses: actions/cache@v5
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/nuxt/fonts
          key: ${{ runner.os }}-nuxt-fonts-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-nuxt-fonts-

      - name: Build Nuxt SSR
        env:
          NODE_ENV: production
          BUILD_ENV: ${{ inputs.build-env }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$ALL_SECRETS")"
          set -a; eval "$BUILD_ENV"; set +a
          pnpm build

      - name: Upload .output via SSH
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SSH_CMD_ARGS: -o IdentitiesOnly=yes
          ARGS: '-avzr --delete'
          SOURCE: ${{ inputs.working-directory }}/.output/
          TARGET: ${{ inputs.target }}/.output

      - name: Write start script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            printf '%s\n' '{' '  "scripts": {' '    "start": "NODE_ENV=production node .output/server/index.mjs"' '  }' '}' > ${{ inputs.target }}/package.json

      - name: Reload Node server
        run: |
          curl --fail --show-error --silent -X POST "https://adm.tools/action/hosting/account/nodejs/reload" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ADM_TOOLS_KEY }}" \
            -d '{"host_id": "${{ inputs.host-id || vars.HOST_ID }}"}'
