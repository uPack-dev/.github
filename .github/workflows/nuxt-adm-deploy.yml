# Reusable: lint, build a Nuxt SSR app, rsync `.output/` into `<target>/.output`
# on adm.tools hosting, write a `package.json` start script into the target
# root, then reload the Node app. Call with `secrets: inherit`; the
# `production` environment is resolved in the calling repository.
#
# Required in the caller: secrets SERVER_SSH_KEY, SERVER_HOST, SERVER_USER,
# ADM_TOOLS_KEY; variable HOST_ID (or the `host-id` input).
name: Nuxt → adm.tools (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Remote app root that receives package.json and .output/, e.g. site.com/www
        required: true
        type: string
      working-directory:
        description: Directory with the Nuxt app
        type: string
        default: .
      build-env:
        description: >-
          Multiline KEY=VALUE list exported for `pnpm build` (use `vars` here —
          every inherited secret is exported under its own name automatically).
        type: string
        default: ''
      host-id:
        description: adm.tools Node app id; defaults to the HOST_ID variable
        type: string
        default: ''
      node-version:
        type: string
        default: '22.21.1'
      runner:
        type: string
        default: ubuntu-latest

jobs:
  preflight:
    name: Check secrets and SSH
    runs-on: ${{ inputs.runner }}
    environment: production
    env:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      ADM_TOOLS_KEY: ${{ secrets.ADM_TOOLS_KEY }}
      HOST_ID: ${{ inputs.host-id || vars.HOST_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Required secrets and variables
        run: |
          missing=
          for v in SERVER_SSH_KEY SERVER_HOST SERVER_USER ADM_TOOLS_KEY HOST_ID TARGET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing or empty:$missing"; exit 1; }
      - name: Target must be a subdirectory of the home directory
        # rsync --delete into $HOME wipes the whole account. Require a relative
        # path with at least one directory level, e.g. site.com/www.
        run: |
          case "$TARGET" in
            /*|.|./*|..|../*|~*|*/..|*/../*|*//*) echo "::error::Refusing target '$TARGET'"; exit 1 ;;
          esac
          [[ "$TARGET" == */* ]] || { echo "::error::Target '$TARGET' must contain a directory level (site.com/www)"; exit 1; }
      - name: SSH connection
        run: |
          umask 077; printf '%s\n' "$SERVER_SSH_KEY" > key
          ssh -i key -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "t=\$(realpath -m '$TARGET'); case \"\$t\" in \"\$HOME\"/?*) mkdir -p \"\$t\" && echo \"ssh ok, target \$t\" ;; *) echo \"refusing target \$t outside \$HOME\"; exit 1 ;; esac"

  lint:
    needs: preflight
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  deploy:
    needs: lint
    runs-on: ${{ inputs.runner }}
    environment: production
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Cache Nuxt Fonts
        uses: actions/cache@v5
        with:
          path: ${{ inputs.working-directory }}/node_modules/.cache/nuxt/fonts
          key: ${{ runner.os }}-nuxt-fonts-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-nuxt-fonts-

      - name: Build Nuxt SSR
        env:
          NODE_ENV: production
          BUILD_ENV: ${{ inputs.build-env }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$ALL_SECRETS")"
          set -a; eval "$BUILD_ENV"; set +a
          pnpm build

      - name: Set up SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          umask 077; mkdir -p ~/.ssh; printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' \
            "${{ secrets.SERVER_HOST }}" "${{ secrets.SERVER_USER }}" > ~/.ssh/config

      - name: Dry-run upload (refuse mass deletions)
        run: |
          del=$(rsync -azn --delete --out-format='%o %n' .output/ deploy:${{ inputs.target }}/.output/ | grep '^del' || true)
          n=$(printf '%s' "$del" | grep -c . || true)
          echo "would delete $n files"; printf '%s\n' "$del" | head -50
          [ "$n" -le 500 ] || { echo "::error::Refusing: $n deletions at target, expected a Nuxt .output"; exit 1; }

      - name: Upload .output
        run: rsync -az --delete .output/ deploy:${{ inputs.target }}/.output/

      - name: Write start script
        run: |
          printf '%s\n' '{' '  "scripts": {' '    "start": "NODE_ENV=production node .output/server/index.mjs"' '  }' '}' \
            | ssh deploy "cat > ${{ inputs.target }}/package.json"

      - name: Reload Node server
        run: |
          curl --fail --show-error --silent -X POST "https://adm.tools/action/hosting/account/nodejs/reload" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ADM_TOOLS_KEY }}" \
            -d '{"host_id": "${{ inputs.host-id || vars.HOST_ID }}"}'
