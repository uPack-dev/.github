# Reusable: build Strapi, prune to production dependencies, write the
# production .env, rsync the project including node_modules to adm.tools
# hosting (uploads and .tmp stay on the server) and reload the Node app.
# Nothing is installed on the server: shared hosting has too little CPU for
# a package manager, and CI runs the same linux-x64 / Node 22 as the host. Call with
# `secrets: inherit`; the `production` environment is resolved by this
# workflow's own jobs, so environment-scoped secrets and vars are read here,
# not in the caller.
#
# Required in the caller: secrets SERVER_SSH_KEY, SERVER_HOST, SERVER_USER,
# ADM_TOOLS_KEY; variable HOST_ID (or the `host-id` input).
name: Strapi → adm.tools (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Remote project directory, e.g. site.com/strapi/
        required: true
        type: string
      dotenv:
        description: >-
          Template of the production .env. Reference both secrets and `vars` as
          `$NAME`: every inherited secret and every `vars` entry is substituted
          by name. Never use a vars expression here, the caller cannot see
          environment-scoped variables. Lines that resolve to an empty value are
          dropped, so write literal fallbacks instead of relying on `||`.
        required: true
        type: string
      working-directory:
        description: Directory with the Strapi app
        type: string
        default: .
      package-manager:
        description: yarn or pnpm
        type: string
        default: yarn
      host-id:
        description: adm.tools Node app id; defaults to the HOST_ID variable
        type: string
        default: ''
      node-version:
        type: string
        default: '22.21.1'
      runner:
        type: string
        default: ubuntu-latest

jobs:
  preflight:
    name: Check secrets and SSH
    runs-on: ${{ inputs.runner }}
    environment: production
    env:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      ADM_TOOLS_KEY: ${{ secrets.ADM_TOOLS_KEY }}
      HOST_ID: ${{ inputs.host-id || vars.HOST_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Required secrets and variables
        run: |
          missing=
          for v in SERVER_SSH_KEY SERVER_HOST SERVER_USER ADM_TOOLS_KEY HOST_ID TARGET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing or empty:$missing"; exit 1; }
      - name: Target must be a subdirectory of the home directory
        # rsync --delete into $HOME wipes the whole account. Require a relative
        # path with at least one directory level, e.g. site.com/www.
        run: |
          case "$TARGET" in
            /*|.|./*|..|../*|~*|*/..|*/../*|*//*) echo "::error::Refusing target '$TARGET'"; exit 1 ;;
          esac
          [[ "$TARGET" == */* ]] || { echo "::error::Target '$TARGET' must contain a directory level (site.com/www)"; exit 1; }
      - name: SSH connection
        run: |
          umask 077; printf '%s\n' "$SERVER_SSH_KEY" > key
          ssh -i key -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "t=\$(realpath -m '$TARGET'); case \"\$t\" in \"\$HOME\"/?*) mkdir -p \"\$t\" && echo \"ssh ok, target \$t\" ;; *) echo \"refusing target \$t outside \$HOME\"; exit 1 ;; esac"

  deploy:
    needs: preflight
    runs-on: ${{ inputs.runner }}
    environment: production
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'yarn.lock' }}

      - name: Install dependencies
        run: ${{ inputs.package-manager }} install --frozen-lockfile

      - name: Build Strapi Admin
        run: ${{ inputs.package-manager }} build
        env:
          NODE_ENV: production

      - name: Prune to production dependencies
        run: ${{ inputs.package-manager == 'pnpm' && 'pnpm prune --prod' || 'yarn install --production --frozen-lockfile' }}

      - name: Write production .env
        env:
          DOTENV: ${{ inputs.dotenv }}
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # This job resolves the `production` environment, so environment-scoped
          # vars and secrets are visible here. A caller's `with:` block is not in
          # any environment, so `${{ vars.X }}` there silently yields "".
          export_json() {
            jq -r 'to_entries[]
              | select(.key | test("^(PATH|HOME|SHELL|IFS|LD_.*|GITHUB_.*|RUNNER_.*)$") | not)
              | "export \(.key)=\(.value | @sh)"'
          }
          eval "$(export_json <<< "$ALL_VARS")"
          eval "$(export_json <<< "$ALL_SECRETS")"
          printf '%s\n' "$DOTENV" | envsubst > .env
          # A `KEY=` line means the template referenced something that resolved
          # to nothing; drop it so Strapi falls back to its own default instead
          # of reading an empty string.
          empty=$(grep -E '^[A-Za-z_][A-Za-z0-9_]*=$' .env | cut -d= -f1 | tr '\n' ' ')
          if [ -n "$empty" ]; then
            echo "::warning::Dropped empty .env values: $empty"
            sed -i -E '/^[A-Za-z_][A-Za-z0-9_]*=$/d' .env
          fi

      - name: Set up SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          umask 077; mkdir -p ~/.ssh; printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' \
            "${{ secrets.SERVER_HOST }}" "${{ secrets.SERVER_USER }}" > ~/.ssh/config

      - name: Upload project
        # No --delete on purpose: a deploy must never be able to remove files.
        run: |
          rsync -az --exclude=public/uploads/ --exclude=.git/ --exclude=.tmp/ \
            ./ deploy:${{ inputs.target }}/

      - name: Reload Node server
        run: |
          curl --fail --show-error --silent -X POST "https://adm.tools/action/hosting/account/nodejs/reload" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ADM_TOOLS_KEY }}" \
            -d '{"host_id": "${{ inputs.host-id || vars.HOST_ID }}"}'
