# Reusable: build Strapi, write the production .env, rsync the project to
# adm.tools hosting (keeping node_modules, uploads and .tmp on the server),
# install prod dependencies there and reload the Node app. Call with
# `secrets: inherit`; the `production` environment is resolved in the caller.
#
# Required in the caller: secrets SERVER_SSH_KEY, SERVER_HOST, SERVER_USER,
# ADM_TOOLS_KEY; variable HOST_ID (or the `host-id` input).
name: Strapi → adm.tools (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Remote project directory, e.g. site.com/strapi/
        required: true
        type: string
      dotenv:
        description: >-
          Template of the production .env. Use `vars` inline and reference
          secrets as `$NAME` — every inherited secret is substituted by name.
        required: true
        type: string
      working-directory:
        description: Directory with the Strapi app
        type: string
        default: .
      package-manager:
        description: yarn or pnpm
        type: string
        default: yarn
      host-id:
        description: adm.tools Node app id; defaults to the HOST_ID variable
        type: string
        default: ''
      node-version:
        type: string
        default: '22.21.1'
      runner:
        type: string
        default: ubuntu-latest

jobs:
  preflight:
    name: Check secrets and SSH
    runs-on: ${{ inputs.runner }}
    environment: production
    env:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      ADM_TOOLS_KEY: ${{ secrets.ADM_TOOLS_KEY }}
      HOST_ID: ${{ inputs.host-id || vars.HOST_ID }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Required secrets and variables
        run: |
          missing=
          for v in SERVER_SSH_KEY SERVER_HOST SERVER_USER ADM_TOOLS_KEY HOST_ID TARGET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing or empty:$missing"; exit 1; }
      - name: SSH connection
        run: |
          umask 077; printf '%s\n' "$SERVER_SSH_KEY" > key
          ssh -i key -o BatchMode=yes -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$TARGET' && echo 'ssh ok, target exists'"

  deploy:
    needs: preflight
    runs-on: ${{ inputs.runner }}
    environment: production
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'yarn.lock' }}

      - name: Install dependencies
        run: ${{ inputs.package-manager }} install --frozen-lockfile

      - name: Build Strapi Admin
        run: ${{ inputs.package-manager }} build
        env:
          NODE_ENV: production

      - name: Write production .env
        env:
          DOTENV: ${{ inputs.dotenv }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<< "$ALL_SECRETS")"
          printf '%s\n' "$DOTENV" | envsubst > .env
          empty=$(grep -E '^[A-Z_]+=$' .env | cut -d= -f1 | tr '\n' ' ')
          [ -z "$empty" ] || echo "::warning::Empty values in .env: $empty"

      - name: Set up SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          umask 077; mkdir -p ~/.ssh; printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n' \
            "${{ secrets.SERVER_HOST }}" "${{ secrets.SERVER_USER }}" > ~/.ssh/config

      - name: Upload project
        run: |
          rsync -az --delete --exclude=public/uploads/ --exclude=.git/ --exclude=.tmp/ --exclude=node_modules/ \
            ./ deploy:${{ inputs.target }}/

      - name: Install dependencies on server
        run: ssh deploy "cd ${{ inputs.target }} && ${{ inputs.package-manager == 'pnpm' && 'npx --yes pnpm@11 install --prod --frozen-lockfile' || 'npx yarn install --production --frozen-lockfile' }}"

      - name: Reload Node server
        run: |
          curl --fail --show-error --silent -X POST "https://adm.tools/action/hosting/account/nodejs/reload" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.ADM_TOOLS_KEY }}" \
            -d '{"host_id": "${{ inputs.host-id || vars.HOST_ID }}"}'
